<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WWII Browser Multiplayer (New Engine)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud">HP: 100</div>
    <canvas id="application-canvas"></canvas>
    <script src="dist/bundle.js"></script>
</body>
</html>
