// CoD2 1.3 browser port — SAFE, PRIVATE-LAN QA BASELINE
// 2026-10-26. Do NOT deploy to a live public server by copying unchanged.
// Source-supported, conservative settings only; no custom patches or external masters.
// Local browser assets and session tickets are handled by the project's existing relay.
//
// Use a separate clean QA server root: main/cod2_13_browser_baseline.cfg
// Start an isolated CoD2 Win32 dedicated server (example command in docs/COD2_SERVER_CFG_RESEARCH.md).
// Keep original active server and QA instances untouched.
// NEVER place original IWD files or CD keys into GitHub.

// Identity / LAN-specific. Do not expose UDP 28961 to the public Internet.
set sv_hostname "WWII Browser MP local QA"
set sv_maxclients "4"
set sv_privateClients "0"
set dedicated "1"
set g_password ""
set rcon_password ""

// Original CoD2 multiplayer protocol/network settings.
// sv_fps is SERVER simulation ticks/second, not GPU FPS.
set sv_fps "20"
set sv_maxRate "25000"
set sv_floodProtect "1"
set sv_timeout "120"
set sv_reconnectlimit "3"
set g_antilag "1"

// Local testing loads original assets from the user's own installation.
// sv_pure 0 is for TEST compatibility only; audit asset integrity before public use.
// Disable automatic IWD transfers; browser assets are managed separately.
set sv_pure "0"
set sv_allowDownload "0"

// Capture useful diagnostics but avoid synchronous per-line disk writes by default.
set logfile "1"
set g_log "games_mp_qa.log"
set g_logSync "0"

// Start with the simplest stock game mode, one controlled map and no cheats.
// Automated harness invokes +devmap mp_toujane at startup; no map_rotate here.
// Do not put +set net_ip / +set net_port into cfg; pass those on command line.
set g_gametype "dm"
set scr_dm_timelimit "0"
set scr_dm_scorelimit "0"
set sv_mapRotation "gametype dm map mp_toujane"
set sv_mapRotationCurrent ""

// Do NOT blindly paste mod-only / CoD2x-only cvars from public configs.
// Optional per-run diagnostics (only after verifying in actual server):
//   +set g_debugBullets 6
// Do not activate sv_wwwDownload or third-party masters in this local test.
// No additional bot slots until tested: 1 human + 15 NORMAL bots remains a future goal.
