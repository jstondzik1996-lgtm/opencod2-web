name: Browser MP regression tests (no game assets)

on:
  push:
    branches:
      - codex/browser-mp-checkpoint
    paths:
      - "tools/**"
      - "tests/cm_world_link/**"
      - "src/PC/qcommon/cm_world.c"
      - ".github/workflows/browser-mp-regressions.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/cm_world_link/**"
      - "src/PC/qcommon/cm_world.c"
      - ".github/workflows/browser-mp-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    name: Python server, lobby and asset-pack regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run asset-free regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
  world-sector-regressions:
    name: Real cm_world.c entity-list harness (i386)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure 32-bit clang and GNU linker exist
        run: |
          clang --version
          ld --version | head -1
      - name: Compile and run original server collision-sector code
        run: sh tests/cm_world_link/run.sh

  browser-lobby-regressions:
    name: Chromium lobby and Quick Play smoke test (stub engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise lobby, Quick Play and full-server fallback
        run: python -m unittest discover -s tools -p 'test_lobby_browser.py' -v

  wasm-compilation:
    name: Emscripten 3.1.74 browser client build (no game assets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Configure test-export WebAssembly client
        run: |
          emcmake cmake -S . -B build/ci-web -G Ninja \
            -DCMAKE_OBJECT_PATH_MAX=200 \
            -DCOD2_WEB_SAFE_HEAP=ON \
            -DCOD2_WEB_TESTING=ON
      - name: Compile browser engine
        run: cmake --build build/ci-web -j 4
      - name: Verify browser engine build products
        run: |
          test -s build/ci-web/cod2.html
          test -s build/ci-web/cod2.js
          test -s build/ci-web/cod2.wasm
          test -s build/ci-web/lobby.js
          echo "WASM compilation: OK; runtime/combat not tested"
