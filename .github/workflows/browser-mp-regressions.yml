name: Browser MP regression tests (no game assets)

on:
  push:
    branches:
      - codex/browser-mp-checkpoint
    paths:
      - "tools/**"
      - "tests/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/browser-mp-regressions.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/browser-mp-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    name: Python server, lobby and asset-pack regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run asset-free regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
  world-sector-regressions:
    name: Real cm_world.c and dobj.c harnesses (i386)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure 32-bit clang and GNU linker exist
        run: |
          clang --version
          ld --version | head -1
      - name: Compile and run original server collision-sector code
        run: sh tests/cm_world_link/run.sh
      - name: Compile and run original bone hitbox trace (DObjTraceline)
        run: sh tests/dobj_trace/run.sh

  win32-server-compilation:
    name: MinGW i686 dedicated server build (no game assets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 i686 toolchain and zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 libz-mingw-w64-dev ninja-build
      - name: Configure Windows dedicated server
        run: |
          cmake -S . -B build/ci-win32 -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_ASM_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres \
            -DCMAKE_FIND_ROOT_PATH=/usr/i686-w64-mingw32
      - name: Compile dedicated server
        shell: bash
        run: |
          set +e
          cmake --build build/ci-win32 -j 4 2>&1 | tee build-win32.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the first errors as annotations (readable via the API).
            grep -E "error|undefined reference|multiple definition|FAILED:" build-win32.log \
              | grep -v "^--" | head -40 | while IFS= read -r line; do
                echo "::error title=win32 build::${line:0:900}"
              done
          fi
          exit $status
      - name: Verify server binary
        run: |
          ls -la build/ci-win32/*.exe
          echo "Win32 server compilation: OK; not run (needs game assets)"

  browser-lobby-regressions:
    name: Chromium lobby and Quick Play smoke test (stub engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise lobby, Quick Play and full-server fallback
        run: python -m unittest discover -s tools -p 'test_lobby_browser.py' -v

  wasm-compilation:
    name: Emscripten 3.1.74 browser client build (no game assets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Configure test-export WebAssembly client
        run: |
          emcmake cmake -S . -B build/ci-web -G Ninja \
            -DCMAKE_OBJECT_PATH_MAX=200 \
            -DCOD2_WEB_SAFE_HEAP=ON \
            -DCOD2_WEB_TESTING=ON
      - name: Compile browser engine
        run: cmake --build build/ci-web -j 4
      - name: Verify browser engine build products
        run: |
          test -s build/ci-web/cod2.html
          test -s build/ci-web/cod2.js
          test -s build/ci-web/cod2.wasm
          test -s build/ci-web/lobby.js
          echo "WASM compilation: OK; runtime/combat not tested"
